<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantra Counter</title>
    <!-- Frame-busting security protection against clickjacking -->
    <script>
        if (window.top !== window.self) {
            window.top.location.href = window.self.location.href;
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Top Navigation / Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #000000;
            z-index: 10;
        }
        .header-title {
            font-size: 15px;
            font-weight: 500;
            color: #52525b;
            letter-spacing: 0.5px;
        }
        .icon-btn-group {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s, background-color 0.2s;
        }
        .icon-btn:hover {
            color: #ffffff;
            background-color: #18181b;
        }
        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        /* Main Tap Section */
        .tap-section {
            flex: 1;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .tap-section:active {
            background-color: #000000;
        }
        .tap-instruction {
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 16px;
        }
        /* Bottom Counter Section */
        .counter-section {
            height: 160px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .counter-display {
            font-size: 84px;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: -2px;
            line-height: 1;
        }
        /* Reset Confirmation Overlay */
        .reset-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .reset-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .reset-dialog {
            background-color: #18181b;
            border: 1px solid #27272a;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        .reset-dialog h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .reset-dialog p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 20px;
        }
        .reset-actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-cancel {
            background-color: #27272a;
            color: #a1a1aa;
        }
        .btn-cancel:hover {
            background-color: #3f3f46;
            color: #ffffff;
        }
        .btn-confirm {
            background-color: #ef4444;
            color: #ffffff;
        }
        .btn-confirm:hover {
            background-color: #dc2626;
        }
        /* Settings Modal Overlay */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .settings-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .settings-dialog {
            background-color: #18181b;
            border: 1px solid #27272a;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
        }
        .settings-dialog h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #ffffff;
            text-align: center;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #27272a;
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .setting-label {
            font-size: 14px;
            color: #d4d4d8;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3f3f46;
            transition: .2s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #3b82f6;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .settings-close-btn {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #27272a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .settings-close-btn:hover {
            background-color: #3f3f46;
        }
    </style>
</head>
<body>

    <!-- Header with Reset Button on Left and Settings on Right -->
    <header>
        <button class="icon-btn" id="resetBtn" title="Reset Count">
            <svg viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.97 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.97 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L15.44,17.95C15.96,18.34 16.5,18.68 17.13,18.93L17.5,21.58C17.54,21.82 17.75,22 18,22H22C22.25,22 22.46,21.82 22.5,21.58L22.87,18.93C23.5,18.68 24.04,18.34 24.56,17.95L27.05,18.95C27.27,19.03 27.54,18.95 27.66,18.73L29.66,15.27C29.79,15.05 29.73,14.78 29.54,14.63L19.43,12.97Z"/></svg>
        </button>
    </header>

    <!-- Main Tap Section -->
    <div class="tap-section" id="tapArea">
    </div>

    <!-- Bottom Counter Section -->
    <div class="counter-section" id="counterArea">
        <div class="counter-display" id="countDisplay">0</div>
    </div>

    <!-- Reset Confirmation Dialog -->
    <div class="reset-overlay" id="resetOverlay">
        <div class="reset-dialog">
            <h3>Reset Count</h3>
            <p>Are you sure you want to reset your counter to zero?</p>
            <div class="reset-actions">
                <button class="btn btn-cancel" id="cancelReset">Cancel</button>
                <button class="btn btn-confirm" id="confirmReset">Reset</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-dialog">
            <h3>Settings</h3>
            <div class="setting-item">
                <span class="setting-label">Fullscreen on Tap</span>
                <label class="switch">
                    <input type="checkbox" id="fullscreenToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <button class="settings-close-btn" id="closeSettings">Done</button>
        </div>
    </div>

    <script>
        let count = 0;
        let fullscreenEnabled = true;
        let hasTriedFullscreen = false;
        let lastModalCloseTime = 0; // Cooldown tracker to prevent key bleed after closing modals

        const tapArea = document.getElementById('tapArea');
        const counterArea = document.getElementById('counterArea');
        const countDisplay = document.getElementById('countDisplay');
        const resetBtn = document.getElementById('resetBtn');
        const resetOverlay = document.getElementById('resetOverlay');
        const cancelReset = document.getElementById('cancelReset');
        const confirmReset = document.getElementById('confirmReset');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const closeSettings = document.getElementById('closeSettings');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        // Load saved data and settings
        function loadData() {
            const savedCount = localStorage.getItem('mantra_count');
            if (savedCount !== null) {
                count = parseInt(savedCount, 10);
            }
            const savedFullscreen = localStorage.getItem('mantra_fullscreen');
            if (savedFullscreen !== null) {
                fullscreenEnabled = savedFullscreen === 'true';
                fullscreenToggle.checked = fullscreenEnabled;
            }
            updateUI();
        }

        function saveData() {
            localStorage.setItem('mantra_count', count);
        }

        function updateUI() {
            countDisplay.textContent = count;
        }

        // Fullscreen helper
        function requestFullscreen() {
            if (!fullscreenEnabled || hasTriedFullscreen) return;
            hasTriedFullscreen = true;
            
            try {
                // Check if document allows fullscreen and request it safely inside a try-catch block
                if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const elem = document.documentElement;
                        if (elem && typeof elem.requestFullscreen === 'function') {
                            const promise = elem.requestFullscreen();
                            if (promise && typeof promise.catch === 'function') {
                                promise.catch(() => {});
                            }
                        } else if (elem && typeof elem.webkitRequestFullscreen === 'function') {
                            elem.webkitRequestFullscreen();
                        }
                    }
                }
            } catch (err) {
                // Completely swallow SecurityError in sandbox/blob iframe environments
            }
        }


function handleFullscreenChange() {
    // If there is currently NO element in fullscreen, it means the browser dropped out
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        hasTriedFullscreen = false;
    }
}

document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);


        function incrementCount() {
            requestFullscreen();
            count++;
            saveData();
            updateUI();
        }

        // Tap handlers for top and bottom sections
        tapArea.addEventListener('click', incrementCount);
        counterArea.addEventListener('click', incrementCount);

        // Global keyboard listener (any key increments)
        window.addEventListener('keydown', (e) => {
            // Ignore if settings or reset modal is open
            if (settingsOverlay.classList.contains('active') || resetOverlay.classList.contains('active')) return;
            // Ignore if within 300ms of closing a modal (prevents Enter/Space bleed)
            if (Date.now() - lastModalCloseTime < 300) return;
            // Ignore if focus is currently on a button or input element
            if (document.activeElement && (document.activeElement.tagName === 'BUTTON' || document.activeElement.tagName === 'INPUT')) return;
            incrementCount();
        });

        // Reset button handlers
        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetOverlay.classList.add('active');
        });

        cancelReset.addEventListener('click', () => {
            if (document.activeElement) document.activeElement.blur();
            resetOverlay.classList.remove('active');
            lastModalCloseTime = Date.now();
        });

        confirmReset.addEventListener('click', () => {
            if (document.activeElement) document.activeElement.blur();
            count = 0;
            saveData();
            updateUI();
            resetOverlay.classList.remove('active');
            lastModalCloseTime = Date.now();
        });

        // Settings modal handlers
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsOverlay.classList.add('active');
        });

        closeSettings.addEventListener('click', () => {
            if (document.activeElement) document.activeElement.blur();
            settingsOverlay.classList.remove('active');
            lastModalCloseTime = Date.now();
        });

        fullscreenToggle.addEventListener('change', (e) => {
            fullscreenEnabled = e.target.checked;
            localStorage.setItem('mantra_fullscreen', fullscreenEnabled);
            
            if (fullscreenEnabled) {
                // Reset the flag so that turning it back on allows fullscreen request on next tap
                hasTriedFullscreen = false;
            } else {
                try {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().catch(() => {});
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                } catch (err) {
                    // Ignore sandbox exit errors
                }
            }
        });

        // Initialize on load
        loadData();
    </script>
</body>
</html>
